# Render Blueprint: New → Blueprint → pick this repo
services:
  - type: web
    name: onthelimit
    runtime: docker
    plan: starter # disks need a paid plan; 512MB fits because FastF1 runs one helper at a time
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # entered in the dashboard on first deploy, never committed
      - key: F1_USERNAME # F1TV account; FastF1 signs in with it to read F1 live timing
        sync: false
      - key: F1_PASSWORD
        sync: false
      - key: THREADS_ACCESS_TOKEN # long-lived token; posts new FiA summaries to Threads
        sync: false
      - key: ADMIN_TOKEN # guards /api/admin (Threads on/off); Render generates it, read it in the dashboard
        generateValue: true
      - key: SITE_URL # Threads posts link to its /docs page
        value: https://www.onthelimit.app
    disk: # FastF1 cache + FiA summaries; a disk also pins the service to one instance
      name: data
      mountPath: /data
      sizeGB: 1
