# Render Blueprint: New → Blueprint → pick this repo
services:
  - type: web
    name: onthelimit
    runtime: docker
    plan: starter # disks need a paid plan; 512MB fits because FastF1 runs one helper at a time
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # entered in the dashboard on first deploy, never committed
    disk: # FastF1 cache + FiA summaries; a disk also pins the service to one instance
      name: data
      mountPath: /data
      sizeGB: 1
